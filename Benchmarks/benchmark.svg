  </g>
  <g>
    <rect x="89" y="353" width="230.1" height="15" rx="7.5" fill="#8191a7"/>
    <rect x="89" y="429" width="111.2" height="15" rx="7.5" fill="#4f97d0"/>
    <rect x="89" y="505" width="52.1" height="15" rx="7.5" fill="#1ba482"/>
    <rect x="454" y="353" width="239.7" height="15" rx="7.5" fill="#8191a7"/>
    <rect x="454" y="429" width="112.2" height="15" rx="7.5" fill="#4f97d0"/>
    <rect x="454" y="505" width="52.4" height="15" rx="7.5" fill="#1ba482"/>
    <rect x="819" y="353" width="234.5" height="15" rx="7.5" fill="#8191a7"/>
    <rect x="819" y="429" width="83.5" height="15" rx="7.5" fill="#4f97d0"/>
    <rect x="819" y="505" width="43.9" height="15" rx="7.5" fill="#1ba482"/>
  </g>

  <g fill="#8997a9" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <text x="89" y="556">0</text><text x="218" y="556" text-anchor="middle">50</text><text x="347" y="556" text-anchor="end">100 MiB</text>
    <text x="454" y="556">0</text><text x="583" y="556" text-anchor="middle">50</text><text x="712" y="556" text-anchor="end">100 MiB</text>
    <text x="819" y="556">0</text><text x="948" y="556" text-anchor="middle">400</text><text x="1077" y="556" text-anchor="end">800 ms</text>
  </g>

  <line x1="66" y1="612" x2="1134" y2="612" stroke="#e3e9f1"/>
  <text x="67" y="642" fill="#34465e" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Median of 3 runs</text>
  <text x="221" y="642" fill="#65758a" font-family="Segoe UI, Arial, sans-serif" font-size="14">Windows x64 · .NET 8 self-contained · synthetic Light-theme notes</text>
  <text x="67" y="668" fill="#7c8a9c" font-family="Segoe UI, Arial, sans-serif" font-size="12">RAM sampled 2 seconds after first window; startup ends at first window handle. Native AOT not measured.</text>
