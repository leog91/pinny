<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Pinny benchmark: WPF, WinForms, and Win32</title>
  <desc id="description">Median of three runs on Windows x64 with self-contained .NET 8 builds. Private working set with one note: WPF 89.2 MiB, WinForms 43.1 MiB, Win32 20.2 MiB. With five notes: WPF 92.9 MiB, WinForms 43.5 MiB, Win32 20.3 MiB. First-window startup with one note: WPF 727 milliseconds, WinForms 259 milliseconds, Win32 136 milliseconds.</desc>
  <rect width="1200" height="720" fill="#f4f7fb"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="#ffffff" stroke="#e3e9f1"/>

  <rect x="66" y="65" width="30" height="30" rx="6" fill="#f4c95b"/>
  <path d="M 87 65 L 96 74 L 87 74 Z" fill="#ffe39b"/>
  <text x="109" y="86" fill="#596b83" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PINNY / BENCHMARK</text>
  <rect x="1015" y="65" width="119" height="30" rx="15" fill="#edf2f8"/>
  <text x="1074.5" y="85" text-anchor="middle" fill="#596b83" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">27 SEP 2026</text>
  <text x="66" y="148" fill="#17283e" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Three ways to build Pinny</text>
  <text x="67" y="180" fill="#65758a" font-family="Segoe UI, Arial, sans-serif" font-size="16">Same core note workflow. Different Windows UI layers.</text>

  <rect x="60" y="216" width="350" height="366" rx="17" fill="#fbfcfe" stroke="#e3e9f1"/>
  <rect x="425" y="216" width="350" height="366" rx="17" fill="#fbfcfe" stroke="#e3e9f1"/>
  <rect x="790" y="216" width="350" height="366" rx="17" fill="#fbfcfe" stroke="#e3e9f1"/>

  <text x="89" y="256" fill="#6a7b91" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">PRIVATE WORKING SET</text>
  <text x="89" y="290" fill="#17283e" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">One note</text>
  <text x="454" y="256" fill="#6a7b91" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">PRIVATE WORKING SET</text>
  <text x="454" y="290" fill="#17283e" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Five notes</text>
  <text x="819" y="256" fill="#6a7b91" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">FIRST WINDOW READY</text>
  <text x="819" y="290" fill="#17283e" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Startup · one note</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    <text x="89" y="338" fill="#56677e">WPF</text><text x="380" y="338" text-anchor="end" fill="#17283e">89.2 MiB</text>
    <text x="89" y="414" fill="#356b9d">WinForms</text><text x="380" y="414" text-anchor="end" fill="#17283e">43.1 MiB</text>
    <text x="89" y="490" fill="#117c61">Win32</text><text x="380" y="490" text-anchor="end" fill="#17283e">20.2 MiB</text>

    <text x="454" y="338" fill="#56677e">WPF</text><text x="745" y="338" text-anchor="end" fill="#17283e">92.9 MiB</text>
    <text x="454" y="414" fill="#356b9d">WinForms</text><text x="745" y="414" text-anchor="end" fill="#17283e">43.5 MiB</text>
    <text x="454" y="490" fill="#117c61">Win32</text><text x="745" y="490" text-anchor="end" fill="#17283e">20.3 MiB</text>

    <text x="819" y="338" fill="#56677e">WPF</text><text x="1110" y="338" text-anchor="end" fill="#17283e">727 ms</text>
    <text x="819" y="414" fill="#356b9d">WinForms</text><text x="1110" y="414" text-anchor="end" fill="#17283e">259 ms</text>
    <text x="819" y="490" fill="#117c61">Win32</text><text x="1110" y="490" text-anchor="end" fill="#17283e">136 ms</text>
  </g>

  <g fill="#e9eef5">
    <rect x="89" y="353" width="258" height="15" rx="7.5"/><rect x="89" y="429" width="258" height="15" rx="7.5"/><rect x="89" y="505" width="258" height="15" rx="7.5"/>
