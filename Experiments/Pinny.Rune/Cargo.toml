[package]
name = "pinny-rune"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

# Build-Rune.ps1 materializes the exact revision from rune-revision.txt here.
# Upstream's required patches must apply at this workspace root, too.
[dependencies]
rune = { path = "../../dist/rune-source/crates/rune", default-features = false, features = ["accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
wgpu-hal = { path = "../../dist/rune-source/vendor/wgpu-hal" }
winit = { path = "../../dist/rune-source/vendor/winit" }
parley_engine = { path = "../../dist/rune-source/vendor/parley_engine" }
accesskit_windows = { path = "../../dist/rune-source/vendor/accesskit_windows" }
accesskit_macos = { path = "../../dist/rune-source/vendor/accesskit_macos" }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
incremental = false
